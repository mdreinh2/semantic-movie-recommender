[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cse573-movie-recommendation"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "scikit-learn>=1.5,<2", "pandas>=2.2,<3"]

[project.optional-dependencies]
kg = ["neo4j>=5.20,<7"]

[project.scripts]
movie-rec = "movie_rec.cli:main"
movie-kg = "movie_rec.kg.cli:main"
